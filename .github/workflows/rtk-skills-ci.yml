name: rtk-skills CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  detect:
    name: Detect RTK_VERSION change
    runs-on: ubuntu-latest
    outputs:
      rtk_changed: ${{ steps.diff.outputs.rtk_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "rtk_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="HEAD~1"
            head="HEAD"
          fi
          if git diff --name-only "$base" "$head" 2>/dev/null | grep -qx 'RTK_VERSION'; then
            echo "rtk_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "rtk_changed=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package checks (no RTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make scripts executable
        run: chmod +x scripts/*.sh
      - name: Structure + artifact checks
        run: ./scripts/validate.sh
      - name: Skill/rule parity
        run: ./scripts/check-parity.sh
      - name: Link check
        run: ./scripts/check-links.sh

  full:
    name: Full validation (pinned RTK)
    needs: detect
    if: needs.detect.outputs.rtk_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make scripts executable
        run: chmod +x scripts/*.sh
      - name: Read pinned RTK version
        id: ver
        run: echo "version=$(cat RTK_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Install pinned RTK
        run: |
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh \
            | RTK_VERSION="v${{ steps.ver.outputs.version }}" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Confirm correct package
        run: rtk --version
      - name: Install Claude hook (so validate --full hook check passes)
        run: rtk init -g --auto-patch
      - name: Smoke — populate tracking so rtk gain has data
        run: |
          rtk git status || true
          rtk ls || true
      - name: Trust + verify dogfood filter (best-effort)
        run: |
          yes | rtk trust || true
          rtk verify || true
      - name: Full validation
        run: ./scripts/validate.sh --full
